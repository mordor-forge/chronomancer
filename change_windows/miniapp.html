<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Change windows</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Colours are Telegram theme roles (themeParams), set from the script. These are the fallbacks. */
:root{color-scheme:light dark;--bg:#f5f6f8;--text:#17202b;--hint:#667080;--card:#fff;--button:#2368d5;--button-text:#fff;--danger:#b3261e;
--line:color-mix(in srgb,var(--hint) 40%,transparent);--night:color-mix(in srgb,var(--text) 9%,transparent);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#17212b;--text:#f5f5f5;--hint:#8a97a5;--card:#232e3c;--button:#2f6ea5;--button-text:#fff;--danger:#ec3942}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
main{max-width:680px;margin:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:22px;line-height:1.25;letter-spacing:-.3px;margin:0;overflow-wrap:anywhere}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0 0 8px}p{margin:6px 0 14px}small{font-size:13px}
.eyebrow{font-size:13px;font-weight:650;margin:0 0 2px}
#door{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
#door-glyph{flex:0 0 auto;width:52px;height:52px;border:2px solid var(--text);border-radius:14px;display:grid;place-items:center}
#door-glyph svg{width:26px;height:26px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#door[data-door=open] #door-glyph{border-width:3px;border-style:double}
#door-sub{margin:4px 0 0;font-size:14px}
#runway{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:18px}
#runway svg{display:block;width:100%;height:auto;overflow:visible}
.day{font-size:13px;font-weight:650;margin:0 0 2px}.day + svg{margin-bottom:10px}
#readout{font-size:13px;margin:4px 0 0;min-height:20px;overflow-wrap:anywhere}
#legend{font-size:12px;margin:2px 0 0}
.tick{stroke:var(--text);stroke-width:1}.tlabel{font:10px var(--mono);fill:var(--text)}.track{fill:none;stroke:var(--line)}
.night{fill:var(--night)}.needle{stroke:var(--text);stroke-width:2}.nowlabel{font:700 10px var(--mono);fill:var(--text)}
.bar{cursor:pointer}.bar .hit{fill:transparent}.bar:focus{outline:none}.bar:focus-visible .shape,.bar.lit .shape{stroke:var(--text);stroke-width:3}
.bar.approved .shape{fill:var(--text)}
.bar.open .shape{fill:var(--button);stroke:var(--text);stroke-width:2}
.bar.pending .shape{fill:url(#cw-hatch);stroke:var(--text);stroke-width:1.5;stroke-dasharray:4 2}
.bar.past .shape{fill:var(--night);stroke:var(--text);stroke-width:1}
.band{fill:url(#cw-cross);stroke:var(--text);stroke-width:1;stroke-dasharray:2 2;pointer-events:none}
.hatch{stroke:var(--text);stroke-width:1.5}
@media (prefers-reduced-motion:no-preference){.bar.fresh .shape{transform-box:fill-box;transform-origin:left;animation:fill .2s ease-out}@keyframes fill{from{transform:scaleX(0)}}}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 6px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--text);color:var(--bg);min-height:46px}button:disabled{opacity:.5;cursor:wait}
.secondary{background:var(--card);color:var(--text);border:1px solid var(--text)}
.item{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.item.lit{border:2px solid var(--text)}
.window{display:block;text-align:left;width:100%;padding:12px;background:transparent;color:var(--text);border-radius:10px}
.window strong{display:block;font-size:18px;overflow-wrap:anywhere}.window small{display:block;margin-top:4px}
.state{text-transform:uppercase;font-size:11px;letter-spacing:.8px;font-weight:700}
.badge{display:block;width:calc(100% - 16px);margin:4px 8px 8px;text-align:left;font-size:14px;font-weight:600;padding:10px 12px;min-height:44px;border-radius:10px;background:transparent;color:var(--text);border:1.5px dashed var(--text);overflow-wrap:anywhere}
#notice{white-space:pre-wrap}section{margin-top:28px}
#audit{list-style:none;padding:0;margin:0;font-size:14px}#audit li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
#audit time{flex:0 0 auto;width:11ch;font:13px/1.6 var(--mono)}#audit .glyph{flex:0 0 auto;width:1.2em;font-weight:700}#audit .what{flex:1 1 auto;min-width:0;white-space:pre-wrap}
/* The sheet covers the page: nothing of the list shows under its bottom edge. */
dialog{width:100%;max-width:680px;height:100dvh;max-height:100dvh;margin:0 auto;border:0;border-radius:0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text)}dialog::backdrop{background:var(--bg,#000)}
.sheetbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.sheetbar button{background:var(--card);color:var(--text);border:1px solid var(--text)}
#detail-name{font-size:20px;overflow-wrap:anywhere}#detail-reason{white-space:pre-wrap;overflow-wrap:anywhere}#detail-meta{white-space:pre-wrap;font-size:14px}
#detail-cards{list-style:none;padding:0;margin:0 0 12px;font-size:14px}#detail-cards li{padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow-wrap:anywhere}
#detail-stamp{display:inline-block;font:700 12px var(--mono);letter-spacing:.6px;text-transform:uppercase;padding:6px 10px;border:3px double var(--text);border-radius:6px;margin:0 0 12px}
#detail-stamp.waiting{border:1.5px dashed var(--text)}
#detail-explain{border:1px solid var(--text);border-left-width:4px;border-radius:10px;padding:12px;margin:0 0 12px;font-size:14px}
#detail-explain dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}#detail-explain dt{font-weight:650}#detail-explain dd{margin:0;overflow-wrap:anywhere}
#detail-overlaps .badge{width:100%;margin:0 0 8px}
.id{font:12px var(--mono);user-select:all;-webkit-user-select:all}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.danger{background:var(--card);color:var(--text);border:2px solid var(--danger)}
#detail-status{white-space:pre-wrap}button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false"><defs>
<pattern id="cw-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="6"/></pattern>
<pattern id="cw-cross" width="5" height="5" patternUnits="userSpaceOnUse"><path class="hatch" d="M0 0L5 5M5 0L0 5"/></pattern>
</defs></svg>
<main>
<header id="door" data-door="loading">
<div id="door-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path id="shackle" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
<div><p class="eyebrow">Change windows</p><h1 id="door-title" role="status" aria-live="polite">Loading windows…</h1><p id="door-sub"></p></div>
</header>
<section id="runway" aria-label="Timeline, today and tomorrow" hidden>
<div id="runway-days"></div>
<p id="readout" aria-live="polite"></p>
<p id="legend">Solid: approved · hatched: proposed · crossed: overlap · shaded: night</p>
</section>
<div class="listhead"><h2>Today + the next 7 days</h2><button id="refresh" class="secondary">Refresh</button></div>
<p id="notice" role="status" aria-live="polite"></p>
<div id="windows" aria-label="Change windows"></div>
<section><h2>Ledger</h2><p>Last 20 matched calls · metadata only</p><ol id="audit"></ol></section>
</main>
<dialog id="detail" aria-labelledby="detail-name">
<div class="sheetbar"><button id="back" hidden>Back</button><span></span><button id="dismiss" aria-label="Dismiss details">Done</button></div>
<div class="state" id="detail-state"></div>
<h2 id="detail-name"></h2><p id="detail-meta"></p><p id="detail-reason"></p>
<ul id="detail-cards" aria-label="Linked Kanban cards"></ul>
<p id="detail-stamp"></p>
<div id="detail-explain" role="region" aria-label="Why these windows conflict" hidden></div>
<div id="detail-overlaps"></div>
<p><span class="id" id="detail-id"></span></p>
<p id="detail-status" role="status" aria-live="polite"></p>
<div class="actions"><button id="approve">Approve</button><button id="decline" class="secondary">Decline</button><button id="close" class="danger">Close window</button></div>
</dialog>
<script>
'use strict';
const tg = window.Telegram?.WebApp;
const $ = id => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';
let current = null, origin = null, serverNow = 0, busy = false, data = null, wasOpen = null;
const trail = [];
const pendingKeys = new Map();
function theme() {
  const t = tg?.themeParams || {};
  for (const [css, key] of Object.entries({'bg':'bg_color','text':'text_color','hint':'hint_color','card':'secondary_bg_color','button':'button_color','button-text':'button_text_color','danger':'destructive_text_color'})) {
    if (/^#[0-9a-f]{6}$/i.test(t[key] || '')) document.documentElement.style.setProperty('--' + css, t[key]);
  }
}
theme(); tg?.onEvent('themeChanged', theme); tg?.ready(); tg?.expand();
async function api(path, options = {}) {
  if (!tg?.initData) throw new Error('Open this list from a private chat with the Telegram bot.');
  const response = await fetch(path, {...options, cache:'no-store', credentials:'omit',
    headers:{'X-Telegram-Init-Data':tg.initData, ...options.headers}});
  const body = await response.json();
  if (!response.ok) {
    const error = new Error(body.error || 'Request failed.');
    error.status = response.status;
    throw error;
  }
  return body;
}
// Every string from the server is agent- or board-written: it only ever becomes textContent.
function node(tag, text, cls) {
  const el = document.createElement(tag); el.textContent = text;
  if (cls) el.className = cls;
  return el;
}
function shape(tag, attrs, cls) {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (cls) el.setAttribute('class', cls);
  return el;
}
const CHANNELS = {telegram: 'Telegram', miniapp: 'the Mini App', desktop: 'Hermes Desktop'};
const pad = n => String(n).padStart(2, '0');
function duration(seconds) {
  const minutes = Math.max(1, Math.round(seconds / 60)), h = Math.floor(minutes / 60), m = minutes % 60;
  return !h ? `${minutes} min` : m ? `${h} h ${m} min` : `${h} h`;
}
// Clock time in the plugin's zone, from the day boundaries the server sends.
function hm(ts) {
  const day = (data?.days || []).find(d => ts >= d.start && ts <= d.end);
  if (!day) return null;
  const minutes = Math.floor((ts - day.start) / 60);
  return `${pad(Math.floor(minutes / 60))}:${pad(minutes % 60)}`;
}
const live = w => w.state === 'approved' && w.closed_at == null;
const stateWord = w => w.open ? 'open now' : w.state === 'pending' && w.end_ts <= serverNow ? 'expired' : w.state === 'approved' && w.end_ts <= serverNow ? 'ended' : w.state;
function relative(w) {
  if (w.open) return `${duration(w.end_ts - serverNow)} left`;
  if (w.start_ts > serverNow) return `starts in ${duration(w.start_ts - serverNow)}`;
  return `ended ${duration(serverNow - Math.min(w.end_ts, w.closed_at || w.end_ts))} ago`;
}
function when(text) {
  const today = data?.days?.[0]?.label;
  return today && text.startsWith(today + ' ') ? text.slice(today.length + 1) : text;
}
function stamp(w) {
  const channel = CHANNELS[w.decided_via] ? ` in ${CHANNELS[w.decided_via]}` : '';
  const at = w.decided_when ? `, ${when(w.decided_when)}` : '';
  if (w.state === 'pending') return w.end_ts > serverNow ? 'Awaiting your decision' : 'Expired without a decision';
  if (w.state === 'declined') return `Declined${channel}${at}`;
  if (w.state === 'cancelled') return 'Withdrawn before a decision';
  return `Approved${channel}${at}` + (w.state === 'closed' && w.closed_when ? ` · Closed ${when(w.closed_when)}` : '');
}
function door() {
  const mode = data.mode || 'enforce';
  const open = data.windows.filter(w => w.open).sort((a, b) => a.end_ts - b.end_ts)[0];
  const next = data.windows.filter(w => live(w) && w.start_ts > serverNow).sort((a, b) => a.start_ts - b.start_ts)[0];
  const waiting = data.windows.filter(w => w.state === 'pending' && w.end_ts > serverNow).length;
  const wait = waiting ? ` ${waiting} proposal${waiting === 1 ? ' waits' : 's wait'} for your decision.` : '';
  let kind = 'closed', title, sub;
  if (mode === 'off') { kind = 'off'; title = 'Guard off: production writes are not checked'; sub = ''; }
  else if (mode === 'warn') { kind = 'warn'; title = 'Warn mode: production writes are recorded, not blocked'; sub = ''; }
  else if (open) {
    kind = 'open'; title = `Open: ${open.name}, ${duration(open.end_ts - serverNow)} left`;
    sub = `Matched writes in scope ${open.scope} are allowed until ${hm(open.end_ts) || open.span}. Other scopes stay blocked.`;
  } else { title = 'Closed: production writes are blocked'; sub = ''; }
  if (kind !== 'open') sub = next ? `Next: ${hm(next.start_ts) || next.starts} ${next.name} (approved), in ${duration(next.start_ts - serverNow)}.` : 'No approved window ahead.';
  $('door').dataset.door = kind;
  $('shackle').setAttribute('d', kind === 'open' || kind === 'off' ? 'M8 11V7a4 4 0 0 1 7.6-1.7' : 'M8 11V7a4 4 0 0 1 8 0v4');
  $('door-title').textContent = title; $('door-sub').textContent = (sub + wait).trim();
}
function barKind(w) {
  if (w.open) return 'open';
  if (w.state === 'pending') return w.end_ts > serverNow ? 'pending' : null;  // an expired proposal never was a window
  if (w.state === 'approved') return w.end_ts > serverNow ? 'approved' : 'past';
  return w.state === 'closed' ? 'past' : null;
}
function runway() {
  const root = $('runway-days'); root.replaceChildren();
  const days = data.days || [];
  $('runway').hidden = !days.length;
  if (!days.length) return;
  const W = Math.max(260, Math.round(root.clientWidth) || 330), PITCH = 24, TOP = 16;
  const open = new Set(data.windows.filter(w => w.open).map(w => w.id));
  days.forEach((day, index) => {
    const len = day.end - day.start;
    const x = ts => Math.round((Math.min(Math.max(ts, day.start), day.end) - day.start) / len * W * 10) / 10;
    const bars = [];
    for (const w of data.windows) {
      const kind = barKind(w), end = Math.min(w.end_ts, w.closed_at || w.end_ts);
      if (!kind || end <= day.start || w.start_ts >= day.end) continue;
      bars.push({w, kind, from: Math.max(w.start_ts, day.start), to: Math.min(end, day.end)});
    }
    bars.sort((a, b) => a.from - b.from);
    const lanes = [];
    for (const bar of bars) {
      let lane = lanes.findIndex(until => until <= bar.from);
      if (lane < 0) lane = lanes.length;
      lanes[lane] = bar.to; bar.lane = lane;
    }
    const H = TOP + Math.max(1, lanes.length) * PITCH + 4;
    const svg = shape('svg', {viewBox: `0 0 ${W} ${H}`, role: 'group', 'aria-label': `${index ? 'Tomorrow' : 'Today'}, ${day.label}: ${bars.length} window${bars.length === 1 ? '' : 's'}`});
    for (const [from, to] of [[0, 6], [22, 24]]) svg.append(shape('rect', {x: W * from / 24, y: TOP, width: W * (to - from) / 24, height: H - TOP}, 'night'));
    svg.append(shape('rect', {x: .5, y: TOP + .5, width: W - 1, height: H - TOP - 1, rx: 4}, 'track'));
    // the "now" label takes the place of an hour label it would cover
    const today = serverNow >= day.start && serverNow < day.end, nowX = Math.min(Math.max(x(serverNow), 1), W - 1), nearEnd = nowX > W - 66;
    const taken = today ? (nearEnd ? [nowX - 74, nowX + 8] : [nowX - 8, nowX + 74]) : null;
    for (const hour of [0, 6, 12, 18, 24]) {
      const tx = Math.min(Math.max(W * hour / 24, .5), W - .5);
      svg.append(shape('line', {x1: tx, y1: TOP - 4, x2: tx, y2: TOP}, 'tick'));
      if (taken && tx + 8 >= taken[0] && tx - 8 <= taken[1]) continue;
      const label = shape('text', {x: tx, y: 9, 'text-anchor': hour === 0 ? 'start' : hour === 24 ? 'end' : 'middle'}, 'tlabel');
      label.textContent = pad(hour); svg.append(label);
    }
    const seen = new Set();
    for (const bar of bars) for (const c of bar.w.conflicts || []) {
      const other = bars.find(b => b.w.id === c.id), key = [bar.w.id, c.id].sort().join();
      if (!other || seen.has(key) || c.end_ts <= day.start || c.start_ts >= day.end) continue;
      seen.add(key);
      const top = TOP + Math.min(bar.lane, other.lane) * PITCH + 2, bottom = TOP + (Math.max(bar.lane, other.lane) + 1) * PITCH - 2;
      const band = shape('rect', {x: x(c.start_ts), y: top, width: Math.max(3, x(c.end_ts) - x(c.start_ts)), height: bottom - top}, 'band');
      band.dataset.band = key; svg.append(band);
    }
    for (const bar of bars) {
      const w = bar.w, left = x(bar.from), width = Math.max(4, x(bar.to) - left), y = TOP + bar.lane * PITCH;
      const fresh = wasOpen && bar.kind === 'open' && !wasOpen.has(w.id) ? ' fresh' : '';
      const g = shape('g', {role: 'button', tabindex: 0, 'aria-label': `${w.name}, ${stateWord(w)}, ${w.span}, ${relative(w)}`}, `bar ${bar.kind}${fresh}`);
      g.dataset.bar = w.id;
      g.append(shape('rect', {x: Math.min(left - Math.max(0, (24 - width) / 2), W - 24), y, width: Math.max(24, width), height: PITCH}, 'hit'),
        shape('rect', bar.kind === 'open' ? {x: left, y: y + 3, width, height: 18, rx: 3} : {x: left, y: y + 5, width, height: 14, rx: 3}, 'shape'));
      const read = () => { $('readout').textContent = `${w.name} · ${stateWord(w)} · ${w.span} · ${relative(w)} · scope ${w.scope}`; };
      g.addEventListener('focus', read); g.addEventListener('pointerenter', read);
      g.addEventListener('click', () => { read(); openSheet(w); });
      g.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openSheet(w); } });
      svg.append(g);
    }
    if (today) {
      const nx = nowX, near = nearEnd;
      svg.append(shape('line', {x1: nx, y1: TOP - 5, x2: nx, y2: H}, 'needle'));
      const label = shape('text', {x: near ? nx - 4 : nx + 4, y: 9, 'text-anchor': near ? 'end' : 'start'}, 'nowlabel');
      label.textContent = `now ${hm(serverNow)}`; svg.append(label);
    }
    root.append(node('p', `${index ? 'Tomorrow' : 'Today'} · ${day.label}`, 'day'), svg);
  });
  wasOpen = open;
  if (!$('readout').textContent) $('readout').textContent = 'Tap a bar to open its window.';
}
function mark(ids) {
  for (const el of document.querySelectorAll('.item')) el.classList.toggle('lit', ids.includes(el.dataset.window));
  for (const el of document.querySelectorAll('.bar')) el.classList.toggle('lit', ids.includes(el.dataset.bar));
}
function overlapButtons(w, parent) {
  for (const c of w.conflicts || []) {
    const button = node('button', `⚠ ${c.label}`, 'badge');  // the wording is the server's
    button.dataset.overlap = c.id;
    button.onclick = () => openConflict(w, c);
    parent.append(button);
  }
}
// The explanation is written once, on the server (overlaps.explain): this only lays it out.
function explain(w) {
  const box = $('detail-explain'); box.replaceChildren();
  const fact = origin && ((w.conflicts || []).find(c => c.id === origin.id));
  box.hidden = !fact;
  if (!fact) return;
  box.append(node('h3', `⚠ ${fact.title}`));
  const list = document.createElement('dl');
  for (const [term, text] of fact.rows) list.append(node('dt', term), node('dd', text));
  box.append(list);
}
function show(w) {
  current = w;
  $('back').hidden = !origin;
  $('detail-state').textContent = stateWord(w);
  $('detail-name').textContent = w.name;
  $('detail-meta').textContent = [`${w.span} · ${relative(w)}`, `scope ${w.scope} · ${w.exclusive ? 'exclusive' : 'shared'}`, w.proposed].filter(Boolean).join('\n');
  $('detail-reason').textContent = w.reason;
  $('detail-cards').replaceChildren();
  const details = new Map((w.card_details || []).map(d => [d.task_id, d]));
  for (const card of w.cards || []) {
    const d = details.get(card.task_id), li = document.createElement('li');
    if (d) li.append(node('span', [d.title, d.status, d.assignee].filter(Boolean).join(' · ') + ' '));
    li.append(node('span', card.task_id, 'id'));
    $('detail-cards').append(li);
  }
  $('detail-cards').hidden = !(w.cards || []).length;
  $('detail-stamp').textContent = stamp(w); $('detail-stamp').className = w.state === 'pending' ? 'waiting' : '';
  explain(w);
  $('detail-overlaps').replaceChildren(); overlapButtons(w, $('detail-overlaps'));
  $('detail-id').textContent = w.id;
  for (const action of ['approve', 'decline', 'close']) {
    const allowed = action === 'close' ? ['pending','approved'].includes(w.state) : w.state === 'pending' && w.end_ts > serverNow;
    $(action).hidden = !allowed; $(action).disabled = busy;
  }
  mark(origin ? [w.id, origin.id] : [w.id]);
}
function openSheet(w) {
  trail.length = 0; origin = null;
  $('detail-status').textContent = ''; show(w);
  if (!$('detail').open) $('detail').showModal();
}
// Tapping an overlap opens the OTHER window, with the explanation; Back returns.
async function openConflict(from, fact) {
  let other = data.windows.find(w => w.id === fact.id);
  if (!other) {
    try { other = (await api('/api/windows/' + fact.id)).window; }
    catch (error) { $('notice').textContent = error.message; return; }
  }
  if ($('detail').open) trail.push({window: from, origin}); else trail.length = 0;
  origin = from;
  $('detail-status').textContent = ''; show(other);
  if (!$('detail').open) $('detail').showModal();
}
function back() {
  const step = trail.pop();
  if (!step) { $('detail').close(); shut(); return; }
  origin = step.origin; $('detail-status').textContent = ''; show(step.window);
}
async function refresh() {
  $('refresh').disabled = true;
  try {
    const [list, activity] = await Promise.all([api('/api/windows'), api('/api/audit')]);
    data = list; serverNow = data.now;
    door(); runway();
    $('windows').replaceChildren();
    for (const w of data.windows) {
      const item = node('div', '', 'item'); item.dataset.window = w.id;
      const main = node('button', '', 'window');
      main.append(node('span', stateWord(w), 'state'), node('strong', w.name),
        node('small', `${w.span} · ${relative(w)}`), node('small', [`scope ${w.scope}`, w.proposed].filter(Boolean).join(' · ')));
      main.onclick = () => openSheet(w);
      item.append(main); overlapButtons(w, item);
      $('windows').append(item);
    }
    $('notice').textContent = data.windows.length ? '' : 'No windows in this period. Ask your agent to propose one.';
    $('audit').replaceChildren();
    const names = new Map(data.windows.map(w => [w.id, w.name]));
    for (const row of activity.audit) {
      const li = document.createElement('li'), at = new Date(row.ts * 1000);
      const time = node('time', `${pad(at.getDate())}.${pad(at.getMonth() + 1)} ${pad(at.getHours())}:${pad(at.getMinutes())}`);
      time.dateTime = at.toISOString();
      li.dataset.verdict = row.verdict;
      li.append(time, node('span', row.verdict === 'blocked' ? '⊘' : row.verdict === 'warned' ? '!' : '✓', 'glyph'),
        node('span', `${row.verdict} · ${row.tool} · ${JSON.parse(row.scopes).join(', ')}${row.window_id ? '\n' + (names.get(row.window_id) || row.window_id) : ''}`, 'what'));
      $('audit').append(li);
    }
    if (!activity.audit.length) $('audit').append(node('li', 'No matched calls recorded yet.'));
    if (current && $('detail').open) {
      const find = async id => data.windows.find(w => w.id === id) || (await api('/api/windows/' + id)).window;
      if (origin) origin = await find(origin.id);
      show(await find(current.id));
    } else mark([]);
  } catch (error) {
    $('notice').textContent = error.message;
    if (!data) { $('door-title').textContent = 'Change windows'; $('door-sub').textContent = ''; }
  }
  finally { $('refresh').disabled = false; }
}
async function act(action) {
  if (busy || !current) return;
  busy = true; show(current);
  const request = current.id + '/' + action;
  if (!pendingKeys.has(request)) pendingKeys.set(request, crypto.randomUUID());
  $('detail-status').textContent = 'Saving…';
  try {
    await api('/api/windows/' + request, {method:'POST', headers:{'Idempotency-Key':pendingKeys.get(request)}});
    pendingKeys.delete(request);
    $('detail-status').textContent = action === 'approve' ? 'Approved.' : action === 'decline' ? 'Declined.' : 'Closed. Later matched calls need another open window.';
  } catch (error) {
    // Keep the same key after a network/server failure: the decision may already have committed.
    if (error.status && error.status < 500 && error.status !== 429) pendingKeys.delete(request);
    $('detail-status').textContent = error.message;
  } finally { busy = false; await refresh(); if (current) show(current); }
}
for (const action of ['approve','decline','close']) $(action).onclick = () => act(action);
$('refresh').onclick = refresh;
const shut = () => { trail.length = 0; origin = null; mark([]); };
$('dismiss').onclick = () => { $('detail').close(); shut(); };
$('back').onclick = back;
$('detail').addEventListener('close', shut);  // Escape and the system back gesture
// The needle follows the clock: re-read every 30 s while the page is visible and nothing is being saved.
setInterval(() => { if (document.visibilityState === 'visible' && !busy && !$('refresh').disabled) refresh(); }, 30000);
refresh();
</script>
