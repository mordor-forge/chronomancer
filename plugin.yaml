name: chronomancer
version: 0.1.0
description: >-
  A shared plan for the Kanban cards of every profile on a gateway. Give a card a slot
  (a planned start and an estimate): the plugin parks the card and releases it at the start,
  with no cron job. An orchestrator agent plans through five tools; the owner plans on a
  Hermes Desktop timeline with a lane per profile. Slots that overlap and share a
  one-at-a-time label are shown as clashes. The plan advises: it never blocks a move.
author: Giorgio De Trane
license: MIT
homepage: https://github.com/Gdetrane/hermes-change-windows
manifest_version: 2
requires_hermes: ">=0.22.7"
tags: [kanban, planning, scheduling, orchestration, desktop]
provides_tools:
  - chrono_plan
  - chrono_slot
  - chrono_now
  - chrono_clear
  - chrono_label
provides_hooks: []
config_schema:
  board:
    type: str
    default: ""
    label: Kanban board
    description: "Slug of the board to plan. Empty = the active board."
  timezone:
    type: str
    default: ""
    label: Time zone
    description: "IANA zone for parsing and showing times, e.g. Europe/Prague. Empty = the system zone by name (TZ, then /etc/localtime)."
  default_estimate_minutes:
    type: int
    default: 60
    label: Default estimate (minutes)
    description: "The estimate of a new slot when none is given."
  comment_on_release:
    type: bool
    default: true
    label: Comment on the card at release
    description: "true: when the plugin releases a card it adds one fixed-text comment with the planned start. false: no comment."
