name: change-windows
version: 0.1.0-dev0
description: >-
  Approved time windows for production changes by agents. A pre_tool_call guard blocks
  production-write tool calls (kubectl apply, helm upgrade, tofu apply, git push,
  PR merges, configured MCP tools) unless an owner-approved window for their scope is open.
  Agents propose windows; the owner approves, declines or closes them with Telegram buttons.
author: Giorgio De Trane
license: MIT
homepage: https://github.com/Gdetrane/hermes-change-windows
manifest_version: 2
requires_hermes: ">=0.22.7"
tags: [safety, guardrails, gitops, kubernetes, kanban, telegram]
provides_tools:
  - window_propose
  - window_list
  - window_next
  - window_close
provides_hooks:
  - pre_tool_call
config_schema:
  mode:
    type: str
    choices: [enforce, warn, "off"]
    default: enforce
    label: Guard mode
    description: "enforce blocks matched calls outside a window; warn only records them; off disables the guard."
  timezone:
    type: str
    default: ""
    label: Time zone
    description: "IANA zone for parsing and showing times (empty = system zone), e.g. Europe/Prague."
  rules:
    type: list
    default: []
    label: Extra rules
    description: "Extra guard rules: {id, scope, tools: [fnmatch], match: regex, field: command|code|*}."
  disabled_rules:
    type: list
    default: []
    label: Disabled default rules
    description: "Ids of default rules to turn off (self-protect cannot be turned off)."
  approver_telegram_ids:
    type: list
    default: []
    label: Approvers (Telegram user ids)
    description: "Telegram user ids that may approve, decline and close windows and read /windows. Empty = nobody can approve."
  owner_chat_id:
    type: int
    default: 0
    label: Owner chat id
    description: "Chat that gets proposal messages. 0 = the private chat of the first approver."
  max_window_hours:
    type: float
    default: 8
    label: Longest window (hours)
  audit_command_preview:
    type: bool
    default: false
    label: Store masked command text in the audit log
    description: "Off: audit rows keep tool, rule ids, scope and size only. On: a masked preview of matched terminal commands is stored; masking is best effort, so secrets can remain."
